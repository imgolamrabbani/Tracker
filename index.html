<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKILLUP - Learning Tracker</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ff00;
            font-family: "Courier New", monospace;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            box-shadow: 0 0 15px #00ff00;
        }
        .gif-container img {
            width: 200px;
            border-radius: 10px;
            box-shadow: 0 0 10px #00ff00;
        }
        h1 {
            font-size: 28px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00ff00;
        }
        select {
            display: block;
            margin: 15px auto;
            background: #0d0d0d;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 8px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        select:hover {
            background: #00ff00;
            color: #0d0d0d;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="gif-container">
            <img src="your-gif-url.gif" alt="Hacker GIF">
        </div>
        <h1>SKILLUP - Learning Tracker</h1>
        <label for="course">Select Course:</label>
        <select id="course" onchange="showWeeks()">
            <option value="">-- Select Course --</option>
            <option value="hacking">Ethical Hacking</option>
            <option value="programming">Programming</option>
        </select>
        
        <div id="week-container" class="week-container hidden">
            <label for="week">Select Week:</label>
            <select id="week" onchange="showDays()">
                <option value="">-- Select Week --</option>
                <option value="week1">Week 1</option>
                <option value="week2">Week 2</option>
            </select>
        </div>
        
        <div id="day-container" class="day-container hidden">
            <label for="day">Select Day:</label>
            <select id="day">
                <option value="">-- Select Day --</option>
                <option value="day1">Day 1</option>
                <option value="day2">Day 2</option>
            </select>
        </div>
    </div>

    <script>
        function showWeeks() {
            document.getElementById('week-container').classList.remove('hidden');
            document.getElementById('day-container').classList.add('hidden');
        }

        function showDays() {
            document.getElementById('day-container').classList.remove('hidden');
        }
    </script>
</body>
</html>
