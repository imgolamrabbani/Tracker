<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
    <!-- For modern browsers -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
    <title>SkillUp</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ff00;
            font-family: "Courier New", monospace;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            box-shadow: 0 0 15px #00ff00;
        }
        .gif-container img {
            width: 200px;
            border-radius: 10px;
            box-shadow: 0 0 10px #00ff00;
        }
        h1 {
            font-size: 28px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00ff00;
        }
        select {
            display: block;
            margin: 15px auto;
            background: #0d0d0d;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 8px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        select:hover {
            background: #00ff00;
            color: #0d0d0d;
        }
        .hidden {
            display: none;
        }
    </style>
    
</head>
<body>
    <div class="container">
        <div class="gif-container">
            <img src="assets/images/giphy.gif" alt="Hacker GIF">
        </div>
        <h1>Personal Development</h1>
        <label for="course">Select Course:</label>
        <select id="course" onchange="showWeeks()">
            <option value="">-- Select Course --</option>
            <option value="wapt">30-Day Web Application Penetration Testing</option>
        </select>
        
        <div id="week-container" class="hidden">
            <label for="week">Select Week:</label>
            <select id="week" onchange="showDays()">
                <option value="">-- Select Week --</option>
                <option value="week1">Week 1: Cybersecurity & Networking Fundamentals</option>
                <option value="week2">Week 2: Web Application Security & Vulnerability Identification</option>
                <option value="week3">Week 3: OWASP Top 10 Deep Dive</option>
                <option value="week4">Week 4: Advanced Web Application Exploitation</option>
                <option value="week5">Week 5: Bug Hunting & Career Boost</option>
            </select>
        </div>
        
        <div id="day-container" class="hidden">
            <label for="day">Select Day:</label>
            <select id="day">
                <option value="">-- Select Day --</option>
            </select>
        </div>
        
        <div id="content-container" class="hidden">
            <h2>Learning Materials</h2>
            <p id="content"></p>
        </div>
    </div>

    <script>
        const weeks = {
            'week1': {
                'day1': "Introduction to Cybersecurity, VirtualBox & Kali Linux Basics.",
                'day2': "Linux Essentials – Commands, File System & Permissions.",
                'day3': "Networking Basics – OSI Model, TCP/UDP, Ports & Protocols.",
                'day4': "Wireshark Basics – Capturing & Analyzing Network Traffic.",
                'day5': `Google Dorking & OSINT – Finding Sensitive Data Online.<br>
                        <a href='https://youtu.be/lESeJ3EViCo' target='_blank'>Video 1</a><br>
                        <a href='https://youtu.be/rTCwJFkuxvI' target='_blank'>Video 2</a><br>
                        <a href='https://youtu.be/o3XmXbh6Sjg' target='_blank'>Video 3</a>`
            },
            'week2': {
                'day8': "Introduction to Burp Suite – Intercepting & Modifying Requests.",
                'day9': "Broken Access Control – Understanding & Exploiting Access Flaws.",
                'day10': "Cryptographic Failures – Weak Encryption & Data Exposure.",
                'day11': "SQL Injection – Understanding & Exploiting SQLi.",
                'day12': "SQL Injection Labs – Hands-on Practical Challenges."
            }
        };
        
        function showWeeks() {
            document.getElementById('week-container').classList.remove('hidden');
            document.getElementById('day-container').classList.add('hidden');
            document.getElementById('content-container').classList.add('hidden');
        }

        function showDays() {
            const weekSelected = document.getElementById('week').value;
            const daySelect = document.getElementById('day');
            daySelect.innerHTML = '<option value="">-- Select Day --</option>';
            
            if (weeks[weekSelected]) {
                for (const day in weeks[weekSelected]) {
                    let option = document.createElement('option');
                    option.value = day;
                    option.textContent = weeks[weekSelected][day].split(" – ")[0];
                    daySelect.appendChild(option);
                }
            }
            
            document.getElementById('day-container').classList.remove('hidden');
            document.getElementById('content-container').classList.add('hidden');
        }

        document.getElementById('day').addEventListener('change', function() {
            const weekSelected = document.getElementById('week').value;
            const selectedDay = this.value;
            document.getElementById('content').innerHTML = weeks[weekSelected][selectedDay] || "No content available.";
            document.getElementById('content-container').classList.remove('hidden');
        });
    </script>
</body>
</html>
